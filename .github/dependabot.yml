version: 2
updates:
  # Enable version updates for npm packages
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    # 7-day release cooldown, matching pnpm's minimumReleaseAge (10080 min)
    # in pnpm-workspace.yaml. Without this, Dependabot proposes versions the
    # resolver would refuse, and the two layers disagree about "latest".
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'automated'
    ignore:
      # eslint 10 is blocked upstream of this repo: eslint-plugin-react,
      # eslint-plugin-import, and eslint-plugin-jsx-a11y (hard deps of
      # eslint-config-next) all cap their peer at eslint ^9 and break at
      # runtime on removed v10 APIs (context.getFilename,
      # scopeManager.addGlobals — measured 2026-08-30). Re-test when
      # eslint-config-next ships an eslint-10-compatible plugin stack.
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      # typescript-eslint refuses TS 7 at runtime ('does not support TS
      # 7.0'; declared range <6.1.0), so TS majors beyond 6.x cannot lint.
      # 6.0.3 (the highest supported release) is landed; drop this ignore
      # when typescript-eslint declares TS 7 support.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      # Group development dependencies together (minor and patch updates)
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      # Group development dependencies together (major updates)
      development-dependencies-major:
        dependency-type: 'development'
        update-types:
          - 'major'
      # Group production dependencies together (minor and patch updates)
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      # Group production dependencies together (major updates)
      production-dependencies-major:
        dependency-type: 'production'
        update-types:
          - 'major'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    # Same 7-day cooldown for action pins — nothing else applies the safety
    # window to Actions (pnpm's minimumReleaseAge only covers npm).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github_actions'
    groups:
      # Group all GitHub Actions updates together
      github_actions:
        patterns:
          - '*'
