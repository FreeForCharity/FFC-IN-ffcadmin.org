name: Weekly Linkinator — External Links (site-wide)

# Scans the whole built site for broken external/vendor URLs.
#
# The main CI linkinator (in ci.yml) skips ALL external URLs by policy
# (they are flaky in PR CI), so external link rot would otherwise go
# undetected. This separate weekly job checks external links across the
# entire site and surfaces 4xx/5xx as a workflow failure for a human to
# triage. Known bot-blocking/rate-limited hosts are skipped in the config.
#
# A status code is not the whole story. A vendor that retires a page but
# keeps serving HTTP 200 (a "soft 404") passes linkinator forever — the
# Google Analytics certification link did exactly that until 2026-10-03.
# So after linkinator, scripts/check-soft-404.mjs re-reads every external
# URL it marked OK and fails the run on retirement / not-found wording or
# on a missing phrase from .link-expectations.json. Pages it cannot judge
# (client-rendered shells, cross-host redirects) are listed as warnings.
#
# Tracking issues: #251, #391.

on:
  schedule:
    # Mondays 13:00 UTC.
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: Scan external URLs across the whole site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build

      - name: Run linkinator with a config that DOES scan external URLs
        id: linkinator
        run: |
          set +e
          pnpm exec linkinator ./out \
            --config .linkinatorrc-external.json \
            --format json \
            > link-report.json
          status=$?
          # Print a short summary regardless of outcome.
          echo "=== Linkinator summary ==="
          jq -r '
            "Total links scanned: \(.links | length)\n" +
            "Passing: \([.links[] | select(.state == \"OK\")] | length)\n" +
            "Broken (4xx/5xx): \([.links[] | select(.status >= 400 and .status < 600)] | length)"
          ' link-report.json || true

          # Emit a structured list of broken URLs if any exist.
          if jq -e '[.links[] | select(.status >= 400 and .status < 600)] | length > 0' link-report.json >/dev/null 2>&1; then
            echo ""
            echo "=== Broken URLs ==="
            jq -r '.links[] | select(.status >= 400 and .status < 600) | "  [\(.status)] \(.url) (from \(.parent))"' link-report.json
            echo "broken=true" >> "$GITHUB_OUTPUT"
          else
            echo "broken=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Re-read OK external URLs for retired content (soft 404s)
        id: soft404
        run: |
          set +e
          node scripts/check-soft-404.mjs link-report.json --out soft-404-report.json
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 0 ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            # A crash is not a clean bill of health; surface it as a failure.
            echo "::error::soft-404 check crashed (exit $status)"
            exit "$status"
          fi

      - name: Upload link reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linkinator-external-report
          path: |
            link-report.json
            soft-404-report.json
          retention-days: 30

      - name: Fail the workflow if broken or stale links were found
        if: steps.linkinator.outputs.broken == 'true' || steps.soft404.outputs.stale == 'true'
        run: |
          if [ "${{ steps.linkinator.outputs.broken }}" = "true" ]; then
            echo "::error::Broken external URLs detected (4xx/5xx). See workflow logs + uploaded artifact."
          fi
          if [ "${{ steps.soft404.outputs.stale }}" = "true" ]; then
            echo "::error::Stale external URLs detected: served HTTP 200 but the content is retired or missing. See the soft-404 section of the logs + soft-404-report.json."
          fi
          exit 1
