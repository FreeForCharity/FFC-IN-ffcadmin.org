name: Trigger Provisioning

# After an intake issue passes verification (the `verified-assignment` label is
# applied), send a repository_dispatch to FFC-Cloudflare-Automation so its
# existing 15-website-provision.yml workflow can provision the site
# (program plan §12). See docs/migration-plan.md for the Cloudflare-side snippet.
#
# GUARDED: needs a cross-repo PAT with repo + workflow scope. It is preferentially
# pulled from Azure Key Vault via OIDC (set the AZURE_* variables); a
# secrets.GH_PAT still works as a fallback. Skips cleanly until one exists. See
# docs/azure-keyvault-setup.md.

on:
  issues:
    types: [labeled]

permissions:
  id-token: write # Azure OIDC (when sourcing the PAT from Key Vault)
  issues: write

env:
  TARGET_REPO: FreeForCharity/FFC-Cloudflare-Automation
  EVENT_TYPE: ffcadmin-website-provision

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Only intake issues with an actual assignee; avoids null-assignee edge
    # cases and accidental dispatches from a manual label add on other issues.
    if: >-
      github.event.label.name == 'verified-assignment' &&
      contains(github.event.issue.labels.*.name, 'kind:intake') &&
      github.event.issue.assignee != null
    steps:
      - name: Guard on credential availability
        id: guard
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_KEY_VAULT_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "use_kv=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$GH_PAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "use_kv=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No GH PAT available (Key Vault or secret); skipping provisioning dispatch until setup is complete."
          fi

      - name: Checkout repository
        if: steps.guard.outputs.use_kv == 'true'
        uses: actions/checkout@v7

      - name: Load GH PAT from Key Vault
        if: steps.guard.outputs.use_kv == 'true'
        uses: ./.github/actions/azure-kv-secrets
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          vault-name: ${{ vars.AZURE_KEY_VAULT_NAME }}
          # Export directly as GH_TOKEN so the dispatch step reads $GH_TOKEN at runtime.
          secrets: |
            GH_TOKEN=${{ vars.KV_SECRET_GH_PAT || 'read-all-cbm-github-pat' }}

      - name: Use GH PAT secret (fallback)
        if: steps.guard.outputs.enabled == 'true' && steps.guard.outputs.use_kv != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: echo "GH_TOKEN=${GH_PAT}" >> "$GITHUB_ENV"

      - name: Dispatch to Cloudflare automation
        if: steps.guard.outputs.enabled == 'true'
        # GH_TOKEN comes from the job environment ($GITHUB_ENV): the Key Vault
        # step or the secret-fallback step set it. No expression here, so the
        # runtime value is always used.
        env:
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ASSIGNEE: ${{ github.event.issue.assignee.login }}
          REPO: ${{ github.repository }}
          BODY: ${{ github.event.issue.body }}
        run: |
          # -e: a failed dispatch must fail the step, not fall through to the
          # success comment below.
          set -euo pipefail
          # Issue-form bodies are "### Label\n\nvalue" blocks. section() prints
          # every non-empty line under the FIRST heading with this label, joined
          # by spaces, and stops at the next heading. Only the first occurrence
          # counts, so a "### <label>" line typed inside a textarea yields one
          # clean value rather than two fields glued together. (It can shadow a
          # later field of the same label; the applicant controls both fields
          # and a sponsor verifies every intake before this runs.) GitHub's
          # exact "_No response_" placeholder is dropped line by line, so it
          # cannot survive by being joined onto other text; a typed
          # "No response" is kept.
          section() {
            printf '%s\n' "$BODY" | awk -v h="### $1" '
              { line = $0; sub(/\r$/, "", line); sub(/[[:space:]]+$/, "", line) }
              line == h && !seen { seen = 1; capture = 1; next }
              line ~ /^### / { capture = 0; next }
              capture {
                sub(/^[[:space:]]+/, "", line)
                if (line != "" && line != "_No response_") out = out (out == "" ? "" : " ") line
              }
              END { print out }
            '
          }
          # The Cloudflare provision workflow reads client_payload.domain, and
          # charity_name / mission for the site footer (one-sentence mission
          # under the charity name on every page).
          DOMAIN=$(section "Desired domain name" | tr -d '[:space:]')
          CHARITY_NAME=$(section "Charity name")
          MISSION=$(section "Brief mission")
          # -f (raw string) for every text value: -F reads a value starting with
          # "@" as a local file path and coerces number-like text, and the title
          # and form fields are applicant-typed. Only the issue number, which
          # comes from the event and is meant to be numeric, stays -F.
          gh api "repos/${TARGET_REPO}/dispatches" \
            -f "event_type=${EVENT_TYPE}" \
            -F "client_payload[ffcadmin_issue]=${ISSUE}" \
            -f "client_payload[charity_title]=${TITLE}" \
            -f "client_payload[issue_url]=${ISSUE_URL}" \
            -f "client_payload[sponsor]=${ASSIGNEE}" \
            -f "client_payload[domain]=${DOMAIN}" \
            -f "client_payload[charity_name]=${CHARITY_NAME}" \
            -f "client_payload[mission]=${MISSION}"
          gh issue comment "$ISSUE" --repo "$REPO" --body \
            "✅ Verified assignment confirmed. Provisioning has been triggered in \`${TARGET_REPO}\`. This issue will update as the site is provisioned."
